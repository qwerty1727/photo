<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Моё фото</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
    #img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: 0 0; will-change: transform; position: absolute; top: 50%; left: 50%; }
    
    #gear {
      position: absolute; top: 16px; right: 16px; width: 46px; height: 46px;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10; transition: background 0.2s;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #gear:active { background: rgba(255,255,255,0.3); }
    #gear svg { width: 24px; height: 24px; fill: #fff; }

    .sheet-wrap {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: flex-end; z-index: 20;
    }
    .sheet-wrap[hidden] { display: none; }
    .sheet {
      width: 100%; background: #1a1a1a; border-top: 1px solid #333; border-radius: 18px 18px 0 0;
      padding: 20px; display: flex; flex-direction: column; gap: 12px;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet h1 { margin: 0 0 8px 0; font-size: 18px; text-align: center; font-weight: 600; }
    .note { font-size: 13px; color: #aaa; text-align: center; margin: 0 0 12px 0; }
    
    .setting-row { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .setting-row label { font-size: 14px; color: #ccc; display: flex; justify-content: space-between; }
    .setting-row input[type="range"] { width: 100%; accent-color: #8ab8ff; }

    .btn {
      width: 100%; padding: 14px; border: 1px solid #333; border-radius: 12px;
      font-size: 16px; font-weight: 500; cursor: pointer; text-align: center; background: transparent; color: #fff;
    }
    .btn.primary { background: #8ab8ff; border-color: #8ab8ff; color: #0b1220; font-weight: 600; }
    .btn:active { opacity: 0.8; }
    .file-hidden { display: none; }
  </style>
</head>
<body>

<div id="stage">
  <img id="img" alt="Фото" draggable="false">
</div>

<button id="gear" aria-label="Настройки">
  <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
</button>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h1 id="sheetTitle">Настройки</h1>
    <p class="note" id="note">Фото и настройки хранятся только на этом телефоне.</p>
    
    <input type="file" id="file" class="file-hidden" accept="image/*">
    <label class="btn primary" for="file">📁 Выбрать новое фото</label>
    
    <div class="setting-row">
      <label>Прозрачность кнопки <span id="opacityVal">100%</span></label>
      <input type="range" id="gearOpacity" min="0.1" max="1" step="0.1" value="1">
    </div>

    <div class="setting-row">
      <label>Масштаб по ширине <span id="scaleXVal">1.0x</span></label>
      <input type="range" id="scaleX" min="0.1" max="3" step="0.1" value="1">
    </div>

    <div class="setting-row">
      <label>Масштаб по высоте <span id="scaleYVal">1.0x</span></label>
      <input type="range" id="scaleY" min="0.1" max="3" step="0.1" value="1">
    </div>

    <button class="btn" id="resetTransform" type="button">🔄 Сбросить размер и положение</button>
    <button class="btn" id="reset" type="button">Вернуть пример по умолчанию</button>
    <button class="btn primary" id="close" type="button" style="margin-top: 8px;">Готово</button>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const img = document.getElementById('img');
const gear = document.getElementById('gear');
const sheetWrap = document.getElementById('sheetWrap');
const fileInput = document.getElementById('file');
const note = document.getElementById('note');
const NOTE_DEFAULT = 'Фото и настройки хранятся только на этом телефоне.';

const MAXS = 8;
const MINS = 0.1;
let st = { sx: 1, sy: 1, x: 0, y: 0 };
let ptrs = {};
let tap = null;
let lastTapTime = 0;
let last = null;
let vel = { x: 0, y: 0 };
let lastT = 0;
let raf = 0;
let reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function openDb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('photo-app-v2', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function dbGet(key) {
  return openDb().then(db => new Promise((resolve, reject) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  }));
}
function dbPut(key, val) {
  return openDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function saveSettings() {
  const settings = {
    sx: st.sx,
    sy: st.sy,
    opacity: parseFloat(document.getElementById('gearOpacity').value)
  };
  dbPut('settings', settings).catch(() => {});
}

function loadSettings() {
  dbGet('settings').then(s => {
    if (s) {
      st.sx = s.sx || 1;
      st.sy = s.sy || 1;
      document.getElementById('scaleX').value = st.sx;
      document.getElementById('scaleXVal').textContent = st.sx.toFixed(1) + 'x';
      document.getElementById('scaleY').value = st.sy;
      document.getElementById('scaleYVal').textContent = st.sy.toFixed(1) + 'x';
      
      const op = s.opacity !== undefined ? s.opacity : 1;
      document.getElementById('gearOpacity').value = op;
      document.getElementById('opacityVal').textContent = Math.round(op * 100) + '%';
      gear.style.opacity = op;
    }
  }).catch(() => {});
}

function box() { return stage.getBoundingClientRect(); }
function fitted() {
  const b = box();
  const nw = img.naturalWidth || b.width;
  const nh = img.naturalHeight || b.height;
  const k = Math.min(b.width / nw, b.height / nh);
  return { w: nw * k, h: nh * k };
}

function clampPan() {
  const b = box(), f = fitted();
  const currentW = f.w * st.sx;
  const currentH = f.h * st.sy;
  const mx = Math.max(0, (currentW - b.width) / 2);
  const my = Math.max(0, (currentH - b.height) / 2);
  st.x = Math.min(mx, Math.max(-mx, st.x));
  st.y = Math.min(my, Math.max(-my, st.y));
}

function apply() {
  clampPan();
  const b = box();
  const f = fitted();
  const centerX = b.width / 2;
  const centerY = b.height / 2;
  const imgX = centerX + st.x - (f.w * st.sx) / 2;
  const imgY = centerY + st.y - (f.h * st.sy) / 2;
  img.style.transform = `translate(${imgX}px, ${imgY}px) scale(${st.sx}, ${st.sy})`;
}

function count() { return Object.keys(ptrs).length; }
function stopInertia() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startInertia() {
  stopInertia();
  if (reduceMotion || Math.hypot(vel.x, vel.y) < 0.05) return;
  let prev = performance.now();
  function step(t) {
    const dt = Math.min(32, t - prev);
    prev = t;
    st.x += vel.x * dt;
    st.y += vel.y * dt;
    vel.x *= 0.92;
    vel.y *= 0.92;
    apply();
    if (Math.hypot(vel.x, vel.y) > 0.05) raf = requestAnimationFrame(step);
  }
  raf = requestAnimationFrame(step);
}

function zoomAt(p, factor) {
  const newSx = Math.min(MAXS, Math.max(MINS, st.sx * factor));
  const newSy = Math.min(MAXS, Math.max(MINS, st.sy * factor));
  
  const qx = (p.x - st.x) / st.sx;
  const qy = (p.y - st.y) / st.sy;
  
  st.sx = newSx;
  st.sy = newSy;
  st.x = p.x - st.sx * qx;
  st.y = p.y - st.sy * qy;
  
  document.getElementById('scaleX').value = st.sx;
  document.getElementById('scaleXVal').textContent = st.sx.toFixed(1) + 'x';
  document.getElementById('scaleY').value = st.sy;
  document.getElementById('scaleYVal').textContent = st.sy.toFixed(1) + 'x';
  
  apply();
  saveSettings();
}

function doubleTapZoom(e) {
  const b = box();
  const p = { x: e.clientX - b.left - b.width / 2, y: e.clientY - b.top - b.height / 2 };
  
  if (st.sx > 1.1 || st.sy > 1.1) {
    // Отдалить к 1x
    st.sx = 1;
    st.sy = 1;
    st.x = 0;
    st.y = 0;
  } else {
    // Приблизить к 2x
    zoomAt(p, 2);
    return;
  }
  
  document.getElementById('scaleX').value = st.sx;
  document.getElementById('scaleY').value = st.sy;
  document.getElementById('scaleXVal').textContent = st.sx.toFixed(1) + 'x';
  document.getElementById('scaleYVal').textContent = st.sy.toFixed(1) + 'x';
  apply();
  saveSettings();
}

stage.addEventListener('pointerdown', e => {
  stopInertia();
  vel.x = 0; vel.y = 0;
  lastT = performance.now();
  try { stage.setPointerCapture(e.pointerId); } catch(err) {}
  const b = box();
  const p = { x: e.clientX - b.left - b.width / 2, y: e.clientY - b.top - b.height / 2 };
  ptrs[e.pointerId] = p;
  
  if (count() === 1) {
    last = p;
    tap = { t: Date.now(), x: e.clientX, y: e.clientY, moved: false };
  }
});

stage.addEventListener('pointermove', e => {
  if (!ptrs[e.pointerId]) return;
  const b = box();
  const p = { x: e.clientX - b.left - b.width / 2, y: e.clientY - b.top - b.height / 2 };
  
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 10) tap.moved = true;
  
  if (count() >= 2) {
    const ids = Object.keys(ptrs);
    const p1 = ptrs[ids[0]], p2 = ptrs[ids[1]];
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (!this.lastDist) this.lastDist = dist;
    
    const factor = dist / this.lastDist;
    if (factor > 0.8 && factor < 1.25) {
      const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      zoomAt(mid, factor);
    }
    this.lastDist = dist;
  } else if (count() === 1 && last) {
    const dx = p.x - last.x;
    const dy = p.y - last.y;
    const now = performance.now();
    const dt = now - lastT;
    if (dt > 0) { vel.x = dx / dt; vel.y = dy / dt; }
    st.x += dx;
    st.y += dy;
    last = p;
    lastT = now;
    apply();
  }
  ptrs[e.pointerId] = p;
});

function endPointer(e) {
  delete ptrs[e.pointerId];
  this.lastDist = null;
  
  if (count() === 0 && tap && !tap.moved) {
    const now = Date.now();
    if (now - lastTapTime < 300) {
      doubleTapZoom(e);
      lastTapTime = 0;
    } else {
      lastTapTime = now;
    }
    startInertia();
  }
  
  tap = null;
  last = null;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

stage.addEventListener('wheel', e => {
  e.preventDefault();
  stopInertia();
  const b = box();
  const p = { x: e.clientX - b.left - b.width / 2, y: e.clientY - b.top - b.height / 2 };
  zoomAt(p, Math.exp(-e.deltaY * 0.002));
}, { passive: false });

function openSheet() { note.textContent = NOTE_DEFAULT; sheetWrap.hidden = false; }
function closeSheet() { sheetWrap.hidden = true; saveSettings(); }

gear.addEventListener('click', openSheet);
document.getElementById('close').addEventListener('click', closeSheet);

document.getElementById('gearOpacity').addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  gear.style.opacity = val;
  document.getElementById('opacityVal').textContent = Math.round(val * 100) + '%';
  saveSettings();
});

document.getElementById('scaleX').addEventListener('input', e => {
  st.sx = parseFloat(e.target.value);
  document.getElementById('scaleXVal').textContent = st.sx.toFixed(1) + 'x';
  apply();
  saveSettings();
});

document.getElementById('scaleY').addEventListener('input', e => {
  st.sy = parseFloat(e.target.value);
  document.getElementById('scaleYVal').textContent = st.sy.toFixed(1) + 'x';
  apply();
  saveSettings();
});

document.getElementById('resetTransform').addEventListener('click', () => {
  st.sx = 1; st.sy = 1; st.x = 0; st.y = 0;
  document.getElementById('scaleX').value = 1;
  document.getElementById('scaleY').value = 1;
  document.getElementById('scaleXVal').textContent = '1.0x';
  document.getElementById('scaleYVal').textContent = '1.0x';
  apply();
  saveSettings();
});

const SAMPLE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2a4a"/><stop offset="0.55" stop-color="#b5546b"/><stop offset="1" stop-color="#f0a35e"/></linearGradient></defs><rect width="1200" height="1600" fill="url(#g)"/><circle cx="840" cy="980" r="130" fill="#ffd9a0" opacity="0.9"/><path d="M0 1180 L220 900 L400 1080 L620 780 L860 1100 L1020 940 L1200 1120 L1200 1600 L0 1600Z" fill="#15192b"/><path d="M0 1380 L300 1200 L560 1330 L860 1180 L1200 1360 L1200 1600 L0 1600Z" fill="#0d1020"/><text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" fill="#ffffff">Здесь будет твоё фото</text><text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" opacity="0.85">Настройки → Выбрать новое фото</text></svg>';
const SAMPLE = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SAMPLE_SVG);

document.getElementById('reset').addEventListener('click', () => {
  img.src = SAMPLE;
  dbPut('photo', null).catch(() => {});
  st.sx = 1; st.sy = 1; st.x = 0; st.y = 0;
  apply();
  closeSheet();
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    img.src = e.target.result;
    st.sx = 1; st.sy = 1; st.x = 0; st.y = 0;
    document.getElementById('scaleX').value = 1;
    document.getElementById('scaleY').value = 1;
    setTimeout(() => apply(), 100);
    dbPut('photo', e.target.result).then(() => {
      closeSheet();
    }).catch(() => {
      note.textContent = 'Фото показано, но не сохранилось (возможно, слишком большое).';
    });
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

window.addEventListener('load', () => {
  loadSettings();
  dbGet('photo').then(saved => {
    if (saved) img.src = saved;
    else img.src = SAMPLE;
    setTimeout(() => apply(), 100);
  }).catch(() => { img.src = SAMPLE; setTimeout(() => apply(), 100); });
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
