<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моё фото</title>
<meta name="theme-color" content="#0c0e11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0c0e11;
    --fg: #eceff4;
    --muted: #9aa3b2;
    --surface: #171a20;
    --line: #2b303a;
    --accent: #8ab8ff;
    --accent-ink: #0b1220;
    --scrim: rgba(5, 7, 10, 0.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    position: relative;
    overflow: hidden;
    color: var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: 50% 50%;
    will-change: transform;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 0;
    display: flex;
    justify-content: flex-end;
  }
  .gear {
    pointer-events: auto;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(12, 14, 17, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--fg);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: opacity 0.4s ease, background 0.2s;
  }
  .gear:active { background: rgba(255, 255, 255, 0.15); }
  .gear svg { width: 22px; height: 22px; }
  body.ui-fading .gear { opacity: 0 !important; pointer-events: none; }
  .sheet-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    background: var(--scrim);
    z-index: 5;
    transition: background-color 0.4s ease;
  }
  .sheet-wrap[hidden] { display: none; }
  .sheet {
    width: 100%;
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    padding: 20px 16px max(16px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background-color 0.4s ease, border-color 0.4s ease;
  }
  .sheet > * { transition: opacity 0.4s ease; }
  body.ui-fading .sheet-wrap { background: transparent; }
  body.ui-fading .sheet { background: transparent; border-color: transparent; }
  body.ui-fading .sheet > *:not(.keep) { opacity: 0; pointer-events: none; }
  body.ui-fading .setting-row.keep {
    background: rgba(23, 26, 32, 0.75);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .sheet h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .note { margin: 0 0 6px; font-size: 14px; color: var(--muted); min-height: 1.45em; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    min-height: 50px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .file-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .setting-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 2px;
    transition: opacity 0.4s ease, background-color 0.4s ease;
  }
  .setting-row label {
    font-size: 14px;
    color: #ccc;
    display: flex;
    justify-content: space-between;
  }
  .setting-row input[type=range] {
    width: 100%;
    accent-color: var(--accent);
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <img class="photo" id="photo" alt="Фото" draggable="false">
</div>

<div class="ui">
  <button class="gear" id="gear" type="button" aria-label="Настройки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h1 id="sheetTitle">Настройки</h1>
    <p class="note" id="note">Фото и настройки хранятся только на этом телефоне.</p>
    <input type="file" id="file" class="file-hidden" accept="image/*">
    <label class="btn primary" for="file">Выбрать новое фото</label>

    <div class="setting-row">
      <label>Прозрачность кнопки <span id="opacityVal">100%</span></label>
      <input type="range" id="gearOpacity" min="0.1" max="1" step="0.05" value="1">
    </div>
    <div class="setting-row">
      <label>Ширина <span id="sxVal">1.0×</span></label>
      <input type="range" id="scaleX" min="0.5" max="3" step="0.05" value="1">
    </div>
    <div class="setting-row">
      <label>Высота <span id="syVal">1.0×</span></label>
      <input type="range" id="scaleY" min="0.5" max="3" step="0.05" value="1">
    </div>

    <button class="btn" id="resetTransform" type="button">Сбросить размер и положение</button>
    <button class="btn" id="reset" type="button">Вернуть пример</button>
    <button class="btn primary" id="close" type="button">Готово</button>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var img = document.getElementById('photo');
  var gear = document.getElementById('gear');
  var sheetWrap = document.getElementById('sheetWrap');
  var sheet = document.getElementById('sheet');
  var note = document.getElementById('note');
  var fileInput = document.getElementById('file');
  var opEl = document.getElementById('gearOpacity');
  var sxEl = document.getElementById('scaleX');
  var syEl = document.getElementById('scaleY');
  var opVal = document.getElementById('opacityVal');
  var sxVal = document.getElementById('sxVal');
  var syVal = document.getElementById('syVal');
  var NOTE_DEFAULT = 'Фото и настройки хранятся только на этом телефоне.';

  var MIN = 0.5, MAX = 8;
  var st = { sx: 1, sy: 1, x: 0, y: 0 };
  var ptrs = {}, gesture = null, tap = null;
  var lastTap = { t: 0, x: 0, y: 0 };
  var last = null, vel = { x: 0, y: 0 }, lastT = 0, raf = 0;
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  function clampS(v) { return Math.min(MAX, Math.max(MIN, v)); }

  function box() { return stage.getBoundingClientRect(); }
  function rel(e) {
    var b = box();
    return { x: e.clientX - b.left - b.width / 2, y: e.clientY - b.top - b.height / 2 };
  }
  function fitted() {
    var b = box();
    var nw = img.naturalWidth || b.width;
    var nh = img.naturalHeight || b.height;
    var k = Math.min(b.width / nw, b.height / nh);
    return { w: nw * k, h: nh * k };
  }
  function clampPan() {
    var b = box(), f = fitted();
    var mx = Math.max(0, (f.w * st.sx - b.width) / 2);
    var my = Math.max(0, (f.h * st.sy - b.height) / 2);
    st.x = Math.min(mx, Math.max(-mx, st.x));
    st.y = Math.min(my, Math.max(-my, st.y));
  }
  function apply() {
    clampPan();
    img.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.sx + ',' + st.sy + ')';
  }
  
  // ИСПРАВЛЕНО: теперь обновляет ползунки
  function syncScaleUI() {
    sxEl.value = st.sx;
    syEl.value = st.sy;
    sxVal.textContent = st.sx.toFixed(2) + '×';
    syVal.textContent = st.sy.toFixed(2) + '×';
  }
  
  function zoomAt(p, factor) {
    var nsx = clampS(st.sx * factor), nsy = clampS(st.sy * factor);
    var qx = (p.x - st.x) / st.sx, qy = (p.y - st.y) / st.sy;
    st.sx = nsx;
    st.sy = nsy;
    st.x = p.x - nsx * qx;
    st.y = p.y - nsy * qy;
    syncScaleUI();
    apply();
    saveSettings();
  }
  
  // ИСПРАВЛЕНО: теперь обновляет ползунки и сохраняет
  function resetView() {
    stopInertia();
    st.sx = 1;
    st.sy = 1;
    st.x = 0;
    st.y = 0;
    syncScaleUI();
    apply();
    saveSettings();
  }

  function stopInertia() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  function startInertia() {
    stopInertia();
    if (reduceMotion || Math.hypot(vel.x, vel.y) < 0.05) return;
    var prev = performance.now();
    function step(t) {
      var dt = Math.min(48, Math.max(1, t - prev));
      prev = t;
      st.x += vel.x * dt;
      st.y += vel.y * dt;
      var k = Math.exp(-dt / 325);
      vel.x *= k;
      vel.y *= k;
      apply();
      if (Math.hypot(vel.x, vel.y) < 0.02) { raf = 0; return; }
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  function count() { return Object.keys(ptrs).length; }
  function startPinch() {
    var ids = Object.keys(ptrs);
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    gesture = {
      d0: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
      sx0: st.sx, sy0: st.sy,
      qx: (mid.x - st.x) / st.sx, qy: (mid.y - st.y) / st.sy
    };
  }

  stage.addEventListener('pointerdown', function (e) {
    stopInertia();
    vel.x = 0;
    vel.y = 0;
    lastT = performance.now();
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    ptrs[e.pointerId] = rel(e);
    if (count() === 1) {
      last = rel(e);
      tap = { t: Date.now(), x: e.clientX, y: e.clientY, moved: false, multi: false };
    } else {
      if (tap) tap.multi = true;
      if (count() === 2) startPinch();
    }
  });

  stage.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) return;
    var p = rel(e);
    ptrs[e.pointerId] = p;
    if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 8) tap.moved = true;

    if (count() >= 2 && gesture) {
      var ids = Object.keys(ptrs);
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      var factor = Math.min(4, Math.max(0.25, d / gesture.d0));
      st.sx = clampS(gesture.sx0 * factor);
      st.sy = clampS(gesture.sy0 * factor);
      st.x = mid.x - st.sx * gesture.qx;
      st.y = mid.y - st.sy * gesture.qy;
      syncScaleUI();
      apply();
    } else if (count() === 1 && last) {
      var nowT = performance.now();
      var dtm = Math.max(1, nowT - lastT);
      vel.x = 0.7 * ((p.x - last.x) / dtm) + 0.3 * vel.x;
      vel.y = 0.7 * ((p.y - last.y) / dtm) + 0.3 * vel.y;
      lastT = nowT;
      st.x += p.x - last.x;
      st.y += p.y - last.y;
      last = p;
      apply();
    }
  });

  function endPointer(e) {
    if (!ptrs[e.pointerId]) return;
    delete ptrs[e.pointerId];
    gesture = null;
    var left = Object.keys(ptrs);
    if (left.length === 1) {
      last = ptrs[left[0]];
    } else if (left.length === 0) {
      last = null;
      if (e.type === 'pointerup' && tap && !tap.moved && !tap.multi && Date.now() - tap.t < 300) {
        var now = Date.now();
        if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
          // Двойной тап
          if (st.sx > 1.05 || st.sy > 1.05) {
            resetView(); // Теперь правильно сбрасывает и сохраняет
          } else {
            zoomAt(rel(e), 2.5);
          }
          lastTap.t = 0;
        } else {
          lastTap = { t: now, x: e.clientX, y: e.clientY };
        }
      }
      if (e.type === 'pointerup' && (st.sx > 1 || st.sy > 1) && !(tap && tap.multi) && performance.now() - lastT < 80) {
        startInertia();
      }
      tap = null;
      saveSettings();
    }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    stopInertia();
    zoomAt(rel(e), Math.exp(-e.deltaY * 0.0022));
  }, { passive: false });

  window.addEventListener('resize', apply);
  img.addEventListener('load', apply);

  function openDb() {
    return new Promise(function (resolve, reject) {
      var r = indexedDB.open('photo-app-v2', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }
  function dbGet(key) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var q = db.transaction('kv').objectStore('kv').get(key);
        q.onsuccess = function () { resolve(q.result); };
        q.onerror = function () { reject(q.error); };
      });
    });
  }
  function dbPut(key, val) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function dbDel(key) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  // ИСПРАВЛЕНО: надёжное сохранение
  function saveSettings() {
    var settings = {
      sx: st.sx,
      sy: st.sy,
      opacity: parseFloat(opEl.value)
    };
    // Сохраняем в localStorage (мгновенно)
    try {
      localStorage.setItem('photo-settings', JSON.stringify(settings));
    } catch (e) {
      console.log('localStorage не доступен:', e);
    }
    // И в IndexedDB (резерв)
    dbPut('settings', settings).catch(function () {});
  }

  function applySettings(s) {
    st.sx = clampS(s.sx || 1);
    st.sy = clampS(s.sy || 1);
    var op = Math.min(1, Math.max(0.1, s.opacity === undefined ? 1 : s.opacity));
    opEl.value = op;
    opVal.textContent = Math.round(op * 100) + '%';
    gear.style.opacity = op;
    syncScaleUI();
    apply();
  }

  // ИСПРАВЛЕНО: загрузка из localStorage
  function loadSettings() {
    var settings = null;
    try {
      var stored = localStorage.getItem('photo-settings');
      if (stored) {
        settings = JSON.parse(stored);
      }
    } catch (e) {
      console.log('Ошибка чтения localStorage:', e);
    }

    if (settings) {
      applySettings(settings);
    } else {
      dbGet('settings').then(function (s) {
        if (s) {
          applySettings(s);
          try {
            localStorage.setItem('photo-settings', JSON.stringify(s));
          } catch (e) {}
        }
      }).catch(function () {});
    }
  }

  var fadeTimer = 0;
  function startFade(row) {
    clearTimeout(fadeTimer);
    var old = sheet.querySelector('.keep');
    if (old) old.classList.remove('keep');
    row.classList.add('keep');
    document.body.classList.add('ui-fading');
  }
  function endFade() {
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(function () {
      document.body.classList.remove('ui-fading');
      var old = sheet.querySelector('.keep');
      if (old) old.classList.remove('keep');
    }, 120);
  }

  [sxEl, syEl].forEach(function (inp) {
    inp.addEventListener('pointerdown', function () { startFade(inp.closest('.setting-row')); });
    inp.addEventListener('pointerup', endFade);
    inp.addEventListener('pointercancel', endFade);
  });

  opEl.addEventListener('pointerdown', function () {
    document.body.classList.remove('ui-fading');
    var old = sheet.querySelector('.keep');
    if (old) old.classList.remove('keep');
  });

  function openSheet() { note.textContent = NOTE_DEFAULT; sheetWrap.hidden = false; }
  function closeSheet() {
    sheetWrap.hidden = true;
    document.body.classList.remove('ui-fading');
    saveSettings();
  }
  gear.addEventListener('click', openSheet);
  document.getElementById('close').addEventListener('click', closeSheet);
  sheetWrap.addEventListener('click', function (e) { if (e.target === sheetWrap) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  opEl.addEventListener('input', function () {
    var v = parseFloat(opEl.value);
    gear.style.opacity = v;
    opVal.textContent = Math.round(v * 100) + '%';
    saveSettings();
  });
  sxEl.addEventListener('input', function () {
    st.sx = clampS(parseFloat(sxEl.value));
    sxVal.textContent = st.sx.toFixed(2) + '×';
    apply();
    saveSettings();
  });
  syEl.addEventListener('input', function () {
    st.sy = clampS(parseFloat(syEl.value));
    syVal.textContent = st.sy.toFixed(2) + '×';
    apply();
    saveSettings();
  });
  document.getElementById('resetTransform').addEventListener('click', function () {
    resetView();
  });

  var SAMPLE_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#1c2a4a"/><stop offset="0.55" stop-color="#b5546b"/><stop offset="1" stop-color="#f0a35e"/>' +
    '</linearGradient></defs>' +
    '<rect width="1200" height="1600" fill="url(#g)"/>' +
    '<circle cx="840" cy="980" r="130" fill="#ffd9a0" opacity="0.9"/>' +
    '<path d="M0 1180 L220 900 L400 1080 L620 780 L860 1100 L1020 940 L1200 1120 L1200 1600 L0 1600Z" fill="#15192b"/>' +
    '<path d="M0 1380 L300 1200 L560 1330 L860 1180 L1200 1360 L1200 1600 L0 1600Z" fill="#0d1020"/>' +
    '<text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" fill="#ffffff">Здесь будет твоё фото</text>' +
    '<text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" opacity="0.85">Настройки → Выбрать новое фото</text>' +
    '</svg>';
  var SAMPLE = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SAMPLE_SVG);

  var currentUrl = null;
  function showBlob(blob) {
    if (currentUrl) { try { URL.revokeObjectURL(currentUrl); } catch (e) {} }
    currentUrl = URL.createObjectURL(blob);
    resetView();
    img.src = currentUrl;
  }
  function showSample() {
    if (currentUrl) { try { URL.revokeObjectURL(currentUrl); } catch (e) {} currentUrl = null; }
    resetView();
    img.src = SAMPLE;
  }
  function downscale(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () {
        var k = Math.min(1, 2560 / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k);
        c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('blob')); }, 'image/jpeg', 0.92);
      };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      im.src = url;
    });
  }

  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var ready = file.size > 8 * 1024 * 1024 ? downscale(file) : Promise.resolve(file);
    ready.then(function (blob) {
      showBlob(blob);
      return dbPut('photo', blob).then(
        function () { closeSheet(); },
        function () { note.textContent = 'Фото показано, но не сохранилось.'; }
      );
    }).catch(function () {
      note.textContent = 'Не удалось открыть файл. Выбери JPG или PNG.';
    }).then(function () {
      try { fileInput.value = ''; } catch (e) {}
    });
  });

  document.getElementById('reset').addEventListener('click', function () {
    showSample();
    dbDel('photo').catch(function () {});
    closeSheet();
  });

  showSample();
  loadSettings();
  dbGet('photo').then(function (blob) { if (blob) showBlob(blob); }).catch(function () {});

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
